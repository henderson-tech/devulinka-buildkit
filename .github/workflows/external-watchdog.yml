name: External Watchdog

# External dead-man's switch for the Lovinka fleet. Lives in THIS public repo
# because GitHub-hosted minutes are free here; the infra repos are private
# with a hard Actions budget. MUST stay on GitHub-hosted runners — a
# self-hosted runner would die with the box it is meant to watch.
#
# Monitoring stool:
#   1. Alertmanager on the devops box — everything while that box is up
#   2. dead-man on a third box       — pages when the devops box goes dark
#   3. THIS workflow (GitHub infra)  — pages when both are dark (provider-
#      level outage). Detection latency ~10-25 min due to schedule jitter;
#      fine for this catastrophic-only tier.
#
# Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (repo secrets).
# Targets are public DNS names, never pinned IPs: a box migration repoints
# DNS, and an IP pinned in a repo variable went stale at the 2026-08-26
# Devulinka move — every run red and every page false for seven weeks.
# Following DNS keeps this on whichever box serves the name.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe both hosts and page on failure
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail
          check() { # check <name> <url> -> 0 up / 1 down (2 attempts)
            local name=$1 url=$2
            for _ in 1 2; do
              curl -fsS -m 12 -o /dev/null "$url" && return 0
              sleep 10
            done
            echo "::error::DOWN: $name ($url)"
            return 1
          }

          failures=""
          # status.fixit.app is the PUBLIC prod status page on the devops box.
          # (status.fixit.dev.lovinka.com is WireGuard-gated since 2026-07-29 —
          # it 403s GitHub runners by design; never probe it from here.)
          check devops-public https://status.fixit.app/ \
            || failures="$failures devops(status.fixit.app)"
          check prod-public https://api.fixit.app/api/v1/health \
            || failures="$failures prod(api.fixit.app)"

          if [ -n "$failures" ]; then
            curl -fsS -m 15 -o /dev/null \
              "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              -d text="🚨🚨 EXTERNAL watchdog (GitHub Actions): unreachable from the public internet:${failures}. If the devops box is in the list, Alertmanager AND the in-estate dead-man may be dead too — possible provider-level outage." \
              || echo "::error::telegram send failed"
            exit 1
          fi
          echo "both hosts healthy"
