name: ci

# Guards the deploy lane's client: deployctl's validation, payload framing,
# nonce authentication and unknown-state semantics regress silently without
# this — the suite is self-contained (bash + python3 stub gateway), so it
# needs no Docker socket and no secret. The bk-lock suite rides along: its
# pressure gate starves every gated class when it reads the lane's CPU quota
# instead of the host's.
#
# It runs on the org's own ephemeral buildkit-ci lane (one container per job,
# no Docker socket). This repo is public, so a pull request from a fork never
# reaches that runner: its job is skipped, and a maintainer pushes the branch
# here to test it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deployctl-tests:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'skip-ci'))
    runs-on: [self-hosted, buildkit-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run deployctl suite
        run: bash scripts/test-deployctl.sh
      - name: Run bk-lock suite
        run: bash scripts/test-bk-lock.sh
