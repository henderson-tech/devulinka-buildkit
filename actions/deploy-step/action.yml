name: deploy-step
description: >
  Run one deploy verb against a logical target through the Devulinka
  deploy-gateway. The job holds no SSH keys and no host addresses — the
  gateway authenticates this runner by its bastion-guest lease and enforces
  which repo may deploy which target.
inputs:
  target:
    description: Logical target name, <project>-<env> (e.g. fixit-prod)
    required: true
  verb:
    description: Dispatcher verb (e.g. version, pull, migrate)
    required: true
  args:
    description: Space-separated verb arguments (optional)
    required: false
    default: ''
  payload-file:
    description: File streamed as the verb's payload (framed bytes+sha256)
    required: false
    default: ''
  payload-env:
    description: >-
      Name of an environment variable whose VALUE is streamed as the payload
      (for secret payloads such as a registry token — deployctl stages it in
      a 0600 temp file it owns and removes; the workflow never writes it).
    required: false
    default: ''
  gateway-url:
    description: >-
      Gateway endpoint (https://host:port). Empty = the runner's own
      DEPLOY_GATEWAY_URL, which a bastion runner carries.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: deploy-step
      shell: bash
      # Inputs reach the script as environment variables only — never by
      # template interpolation into the script source, so a value containing
      # quotes or $(...) is data, not shell.
      # The input rides its own name: binding DEPLOY_GATEWAY_URL here would
      # blank the runner's value whenever the input is empty.
      env:
        GATEWAY_URL_INPUT: ${{ inputs.gateway-url }}
        STEP_TARGET: ${{ inputs.target }}
        STEP_VERB: ${{ inputs.verb }}
        STEP_ARGS: ${{ inputs.args }}
        STEP_PAYLOAD_FILE: ${{ inputs.payload-file }}
        STEP_PAYLOAD_ENV: ${{ inputs.payload-env }}
      run: |
        set -euo pipefail
        if [[ -n "$GATEWAY_URL_INPUT" ]]; then export DEPLOY_GATEWAY_URL="$GATEWAY_URL_INPUT"; fi
        extra=()
        if [[ -n "$STEP_PAYLOAD_FILE" && -n "$STEP_PAYLOAD_ENV" ]]; then
          echo "deploy-step: payload-file and payload-env are mutually exclusive" >&2
          exit 2
        fi
        if [[ -n "$STEP_PAYLOAD_FILE" ]]; then
          extra+=("@$STEP_PAYLOAD_FILE")
        elif [[ -n "$STEP_PAYLOAD_ENV" ]]; then
          extra+=("@env:$STEP_PAYLOAD_ENV")
        fi
        read -r -a verb_args <<< "$STEP_ARGS"
        bash "${GITHUB_ACTION_PATH}/../../scripts/deployctl.sh" \
          "$STEP_TARGET" "$STEP_VERB" ${verb_args[@]+"${verb_args[@]}"} ${extra[@]+"${extra[@]}"}
