name: bk / test-bun

# Reusable Bun test/build lane for Devulinka self-hosted runners.
#
#   jobs:
#     web-test:
#       uses: henderson-tech/devulinka-buildkit/.github/workflows/test-bun.yml@v1
#       with:
#         runs-on: '["self-hosted","deployik-ci"]'
#         working-directory: web
#         run: |
#           bunx tsc --noEmit
#           bun run test
#           bun run build
#
# On Devulinka runners the Bun download + install cache is a shared named
# volume (runner-bun → /home/runner/.bun) that survives across jobs and
# repos, so installs are warm by default — no actions/cache round-trip.

# The lane needs nothing beyond reading the repo — never inherit a caller's
# wider token (pull_request_target hands out a write-capable one).
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON array of runner labels.
        required: true
        type: string
      run:
        description: Commands to run after install.
        required: true
        type: string
      ref:
        type: string
        default: ''
      bun-version:
        description: Pinned Bun version. Keep in sync with the repo's packageManager field.
        type: string
        default: '1.4.3'
      working-directory:
        type: string
        default: '.'
      install:
        description: Run bun install before the commands.
        type: boolean
        default: true
      frozen-lockfile:
        type: boolean
        default: true
      clean:
        description: >-
          Pass false to keep untracked build caches (node_modules, .next/cache,
          *.tsbuildinfo) on the persistent runner workdir; a scoped git clean
          still removes every other untracked file. Default true = the old
          full `git clean -ffdx` behavior. Ignored (forced clean) on
          pull_request events: a PR job must never inherit — or seed — caches
          on the persistent workdir a trusted branch/tag job later reuses.
        type: boolean
        default: true
      timeout-minutes:
        description: >-
          Bounds the install and run steps EACH (not the job — the job keeps a
          wide fixed backstop so the PR-isolation cleanup always runs). Capped
          at 150: two full steps must still leave the cleanup headroom under
          the 350-minute job backstop.
        type: number
        default: 30

jobs:
  test:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    # The caller's budget bounds the EXPENSIVE steps (install + run) below, not
    # the job: a job-level timeout would kill the always() PR-isolation cleanup
    # with them. The job backstop sits far above any realistic install+run sum
    # (each step is individually capped), so cleanup always has headroom.
    timeout-minutes: 350
    steps:
      # GH expressions have no min()/arithmetic, so the budget invariant
      # (2 × step-timeout + cleanup < job backstop) is enforced as a hard
      # fail-fast: a caller asking for more than 150 min/step could otherwise
      # burn the whole 350-min backstop in install+run and starve the always()
      # PR-isolation cleanup.
      - name: Enforce step-budget cap
        if: ${{ inputs.timeout-minutes > 150 }}
        env:
          # Inputs never land in shell source directly (host-root run blocks);
          # the number rides env and is quoted on expansion.
          TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        run: |
          echo "::error::timeout-minutes=${TIMEOUT_MINUTES} exceeds the 150-minute cap (2 steps must fit under the 350-minute job backstop with cleanup headroom)"
          exit 1

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          clean: ${{ inputs.clean || startsWith(github.event_name, 'pull_request') }}
          # The test lane never pushes; on pull_request_target the default
          # token can be write-capable — never leave it in .git/config.
          persist-credentials: false

      - name: Clean untracked files (keep dependency caches)
        if: ${{ !inputs.clean && !startsWith(github.event_name, 'pull_request') }}
        run: git clean -ffdx -e node_modules -e '**/.next/cache' -e '*.tsbuildinfo'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      # PR jobs must not write the shared warm Bun cache (a runner volume that
      # survives across jobs and repos): give them a job-local cache dir
      # instead. Runner-level mount isolation is the real boundary for hostile
      # code; this keeps ordinary PR runs from ever touching the shared path.
      - name: Scope Bun cache for PR isolation
        if: ${{ startsWith(github.event_name, 'pull_request') }}
        run: echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache-pr" >> "$GITHUB_ENV"

      - name: Install dependencies
        if: ${{ inputs.install }}
        working-directory: ${{ inputs.working-directory }}
        timeout-minutes: ${{ inputs.timeout-minutes }}
        run: bun install ${{ inputs.frozen-lockfile && '--frozen-lockfile' || '' }}

      - name: Run
        working-directory: ${{ inputs.working-directory }}
        timeout-minutes: ${{ inputs.timeout-minutes }}
        env:
          # The input IS a script by contract, but it still rides env instead
          # of being interpolated into shell source: quotes/backticks in the
          # caller's snippet cannot mangle THIS workflow's generated step file.
          RUN_SCRIPT: ${{ inputs.run }}
        run: eval "$RUN_SCRIPT"

      # PR isolation, second half: the pre-job clean stops a PR job from
      # INHERITING caches; this stops it from SEEDING them. Whatever the PR
      # run wrote (node_modules, build caches) is removed even on failure, so
      # a later branch/tag job with clean:false consumes WORKSPACE caches
      # produced only by trusted refs. This is DEFENSE-IN-DEPTH, not a
      # boundary: the shared Bun volume mounts at ~/.bun (inside HOME), any
      # write there by hostile code survives, and a detached process
      # (`nohup … &`) outlives this step and can re-poison state after it
      # reports green. The real boundary is runner-level mount/user
      # isolation (devulinka-infra follow-up).
      # No `|| true`: a failed clean means the PR left state a trusted job
      # would inherit — that must be loud, not swallowed.
      - name: Post-job clean (PR isolation)
        if: ${{ always() && startsWith(github.event_name, 'pull_request') }}
        env:
          # Pinned PATH: the caller-controlled run step executes PR code that
          # can append to GITHUB_PATH — the cleanup must resolve git/chmod
          # from system dirs, never from a PR-planted shim.
          PATH: /usr/local/bin:/usr/bin:/bin
          # Step-level env beats GITHUB_ENV, so a PR step cannot point this
          # shell's startup file at its own script (non-interactive bash
          # sources BASH_ENV; sh sources ENV) — and cannot forge the re-exec
          # sentinel to skip the env scrub.
          BASH_ENV: ''
          ENV: ''
          CLEAN_REEXEC: ''
          # RUNNER_* should be runner-protected, but pin it anyway: it feeds
          # an rm -rf (bounded by the /bun-cache-pr suffix).
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          # Re-exec with a scrubbed environment before doing anything else:
          # kills every other PR-planted variable, including BASH_FUNC_*
          # exported-function shims that would shadow git/chmod. HOME is
          # deliberately NOT carried over — a PR step can rewrite it via
          # GITHUB_ENV; the trusted home is re-derived from passwd below.
          if [ -z "${CLEAN_REEXEC:-}" ]; then
            exec /usr/bin/env -i CLEAN_REEXEC=1 PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" /bin/bash --noprofile --norc -eo pipefail "$0"
          fi
          # Re-open permissions FIRST, .git included: `chmod 000 .git` by PR
          # code would otherwise abort the -e shell on the very first rm,
          # before any recovery ran. Best-effort (weird symlinks may error);
          # every strict operation below stays loud.
          chmod -R u+rwX . 2>/dev/null || true
          # Strip PR-controllable git metadata BEFORE the first git call:
          # hooks, hooksPath/fsmonitor/filter config in .git/config can carry
          # executable payloads that the next TRUSTED job (or this git clean)
          # would run. actions/checkout recreates the remote and its config on
          # the next job, so nuking the local config is safe here.
          if [ -d .git ]; then
            rm -rf .git/hooks
            mkdir -p .git/hooks
            rm -f .git/config
          fi
          # PR code can also write persistent HOME state that later TRUSTED
          # jobs' tools read: git config/credentials, shell startup files,
          # bun/npm/docker config. Scrub the known config-injection surfaces
          # in the runner user's REAL home from passwd — $HOME itself is
          # PR-forgeable via GITHUB_ENV and was dropped by the re-exec. A
          # blocklist is never complete (defense-in-depth, see the step
          # comment); ~/.docker matters most here: a planted cli-plugin or
          # credsStore would be EXECUTED by the next trusted DooD build job.
          # Guarded so a getent failure degrades to workspace-clean-only
          # instead of aborting the -e shell before git clean.
          TRUSTED_HOME="$(getent passwd "$(id -u)" | cut -d: -f6 || true)"
          if [ -n "$TRUSTED_HOME" ]; then
            rm -rf "$TRUSTED_HOME/.gitconfig" "$TRUSTED_HOME/.config/git" "$TRUSTED_HOME/.netrc" \
                   "$TRUSTED_HOME/.bunfig.toml" "$TRUSTED_HOME/.npmrc" \
                   "$TRUSTED_HOME/.docker/config.json" "$TRUSTED_HOME/.docker/cli-plugins" \
                   "$TRUSTED_HOME/.local/bin" "$TRUSTED_HOME/.ssh" "$TRUSTED_HOME/.config/gh" \
                   "$TRUSTED_HOME/.bashrc" "$TRUSTED_HOME/.bash_profile" "$TRUSTED_HOME/.bash_login" "$TRUSTED_HOME/.profile"
          else
            echo "::warning::getent gave no home dir — HOME scrub skipped, workspace clean still enforced"
          fi
          # A PR job can die AT checkout (budget cap, checkout failure) — no
          # repo means nothing to clean, and mkdir'ing .git here would force
          # the next checkout into a full re-clone.
          if [ ! -d .git ]; then
            echo "No repository in the workdir — nothing to clean."
            rm -rf "$RUNNER_TEMP/bun-cache-pr"
            exit 0
          fi
          # retry once after re-opening permissions — the common way a PR run
          # makes its droppings undeletable; still loud if that also fails.
          git clean -ffdx || { chmod -R u+rwX . && git clean -ffdx; }
          rm -rf "$RUNNER_TEMP/bun-cache-pr"
